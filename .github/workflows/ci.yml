name: CI

on:
  push:
    branches: [main]
  pull_request:

# Since ADR-0075 the ~10 min k3d job runs on every push to a pull request rather than once per
# merge, so a branch pushed three times in a row pays three times over — usually for commits
# nobody is waiting on any more. This block drops that to one live run per branch. It could not
# be added while the merge queue existed: cancelling a run under a queue IS an eviction, so the
# very mechanism that saves the minutes here would have dropped PRs out of the queue there.
concurrency:
  # On a pull request the group is the branch, so a new push supersedes the run still going for
  # the commit it replaced. On a push to main the group is the commit instead, which means main
  # builds neither cancel nor queue behind one another — every merged commit gets its own result.
  # That asymmetry is deliberate. Branches are not required to be current with main (ADR-0075 §3)
  # and main is fixed forward, so the per-commit build is the signal that says a merge broke it;
  # cancelling it would discard the only evidence, and merely queueing it would delay the
  # discovery by a full run. A superseded PR run has no such value — its commit is already gone.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  # changes detects whether anything other than documentation changed, so the heavy build
  # and integration jobs can be skipped on docs-only PRs. A skipped required check still
  # counts as passing for branch protection, so a docs-only PR still goes green.
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      quickstart: ${{ steps.filter.outputs.quickstart }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # predicate-quantifier: every is LOAD-BEARING — do not drop it, and do not "simplify"
          # this list back to a bare set of patterns. The action's default quantifier is `some`,
          # under which a file matches the filter if it matches ANY line. Because '**' matches
          # every path, the '!' lines were dead: `code` evaluated true for every change on every
          # event, so the docs-only skip below never once fired. It looked like it worked only
          # because kube-integration was then separately gated on merge_group, which hid the
          # always-true `code` on PRs; in the queue nothing hid it and a two-file docs-only
          # change (PR #356) ran the ~10 min k3d job. `every` makes all lines conjunctive, which
          # is what turns the '!' lines back into real exclusions.
          predicate-quantifier: every
          # Docs-only is deliberately NARROW: only the root README.md and anything under docs/.
          # A markdown file anywhere else — CLAUDE.md, LICENSING.md, a nested README.md — counts as
          # code and runs the full checks. This replaces a broader '!**/*.md' that treated every
          # markdown file in the tree as docs; widening it back is a silent way to stop testing
          # changes that matter. Erring toward running the suite is the safe direction here: a
          # needless 10-minute run only costs time, a wrongly skipped one merges untested code.
          # The `quickstart` filter is the ONE exception to "anything under docs/ is docs-only",
          # and it is deliberate, not an oversight. docs/QUICKSTART.md is executable documentation:
          # test/e2e/quickstart.sh walks the doc's fast path command for command to keep it from
          # rotting, and that script is a STEP INSIDE kube-integration, not a job of its own. So
          # without this filter, editing QUICKSTART.md would be classified docs-only, skip
          # kube-integration, and skip the very test that proves the doc's commands still work —
          # on the one page a brand-new user runs first, where a broken command is most expensive.
          # `predicate-quantifier: every` is conjunctive and cannot express "docs, except this one
          # file" inside `code`, hence a second named filter OR'd into the job condition below.
          filters: |
            code:
              - '**'
              - '!README.md'
              - '!docs/**'
            # A POSITIVE filter under `predicate-quantifier: every` must name EXACTLY ONE
            # pattern. `every` is one input applying to every filter in this block and it is
            # conjunctive, so a file has to match ALL of a filter's lines. That is what makes
            # `code`'s '!' exclusions real — and it means a second positive line here asks for
            # a file that is both 'docs/QUICKSTART.md' AND something else, which no file is:
            # the filter would match nothing, silently, and stop gating the doc it exists to
            # pin, with every check still green. Same failure class as the bug `every` fixed,
            # wearing the other face — `some` kills negations, `every` kills multi-pattern
            # positives. To pin a SECOND doc, add ANOTHER named filter with its own single
            # pattern and OR it into the job condition, the way kube-integration's `if:`
            # already ORs `quickstart` in. Do not add a line below.
            quickstart:
              - 'docs/QUICKSTART.md'

  build:
    name: build, vet, fmt, test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: burrow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Runs the controlplane/postgres integration tests against the service container
      # above instead of skipping them (ADR-0012: in-cluster Postgres, tested for real).
      BURROW_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/burrow_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { echo "gofmt needed:"; gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        run: go test ./...

  # Provenance checks: cheap, need no toolchain, and run on every event — including docs-only
  # changes, which is the point. Both rules they enforce (a licence header on every Go file, a
  # sign-off on every commit) are about who may use and who contributed the tree, so neither can
  # be gated on whether the change touched code.
  license:
    name: SPDX headers and DCO sign-off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The DCO check reads the commits the branch adds, and the default depth-1 checkout
          # contains none of them.
          fetch-depth: 0
      - name: check SPDX headers
        run: bash scripts/check-spdx.sh
      # Only on a pull request, because that is the only event where the check can be acted on.
      # A sign-off cannot be added to a commit already on main without rewriting main, so failing
      # a push build would report a problem with no fix and go on reporting it on every later
      # push. The pull request is where it is still one `--amend` away, and GitHub's squash merge
      # carries the branch's trailer into the commit that lands, so gating there is what keeps
      # main signed off.
      #
      # The base and head are taken from the event rather than from the checkout, following the
      # same event-conditional shape as the concurrency group above. What CI checks out for a
      # pull request is a merge commit GitHub synthesises from the branch and the base branch, so
      # HEAD is not the branch tip and `origin/main..HEAD` would describe a range nobody wrote.
      # The event carries the two real endpoints, and fetch-depth: 0 is what makes both of them
      # (and everything between) present in the clone.
      - name: check DCO sign-off
        if: github.event_name == 'pull_request'
        env:
          DCO_BASE: ${{ github.event.pull_request.base.sha }}
          DCO_HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/check-dco.sh

  kube-integration:
    name: kubernetes integration (k3d)
    needs: changes
    # This job runs on PULL REQUESTS, and the absence of an event gate is deliberate (ADR-0075).
    # It used to carry `&& github.event_name == 'merge_group'`, which made the merge queue the
    # only place the k3d suite — the only place Burrow is exercised against a real API server —
    # ever ran. On a PR it reported SKIPPED, the aggregate gate below counts a skip as fine, and
    # the PR went green having never touched a Kubernetes API server. Do not re-add an event
    # gate here: with the queue gone the condition would simply never be true again and the
    # integration suite would silently leave the pipeline while every check stayed green.
    # The cost is accepted knowingly — the ~9 min suite now runs on every code push rather than
    # once per merge, which is affordable because the docs-only filter above genuinely skips.
    #
    # The `quickstart` disjunct is what keeps docs/QUICKSTART.md honest: it is docs-only by the
    # `code` filter, but the quickstart e2e step below is the test that pins it, so a change to
    # that doc has to run this job or the doc could rot unnoticed. Only THIS job gets the
    # disjunct — `build` stays gated on `code` alone, because editing a markdown file cannot
    # break gofmt, go vet, or go test, and this job recompiles the tree anyway.
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.quickstart == 'true'
    runs-on: ubuntu-latest
    # Make the `go test` steps compile with the same flags ko uses for the burrowd build, so ko
    # reuses the client-go objects the tests already compiled instead of a cold recompile. ko
    # builds static (CGO off) and with -trimpath by default; CI's go test would otherwise default
    # to CGO on and no -trimpath, giving every package a different build-cache key.
    env:
      CGO_ENABLED: "0"
      GOFLAGS: "-trimpath"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          # Manage the build cache explicitly below: setup-go keys only on go.sum (not the build
          # flags) and never re-saves on an exact key hit, so it would restore a stale cache built
          # with this job's old flags and recompile client-go cold every run.
          cache: false
      # ko builds the burrowd image for the capstone e2e from the host Go cache (warm from the
      # test runs in this job), instead of recompiling inside a docker build.
      - uses: ko-build/setup-ko@v0.8
      # Cache compiled packages + modules across runs so the test compiles (and ko, which reuses
      # them) are warm. Keyed on go.sum and scoped to this job, whose flags are constant — so the
      # client-go objects stay cached; only Burrow's own (changed) packages recompile each run.
      - name: cache go build + module caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: gocache-kube-${{ runner.os }}-go1.26-${{ hashFiles('go.sum') }}
          restore-keys: |
            gocache-kube-${{ runner.os }}-go1.26-
      - name: install k3d
        run: curl -sfL https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash
      - name: create cluster
        run: k3d cluster create burrow-ci --wait --timeout 120s
      - name: preload test images
        run: |
          images="busybox:1.36 busybox:1.37 mendhak/http-https-echo:31 nginx:alpine nginx:1.27-alpine victoriametrics/victoria-logs:v1.51.0 victoriametrics/victoria-metrics:v1.115.0 victoriametrics/vmagent:v1.115.0 fluent/fluent-bit:3.2.10 grafana/loki:3.2.1 prom/prometheus:v3.1.0 valkey/valkey:8.0 postgres:17-alpine curlimages/curl:8.11.1 ghcr.io/cloudnative-pg/cloudnative-pg:1.30.0 ghcr.io/cloudnative-pg/postgresql:17.10-minimal-trixie"
          # Pull in parallel (serial pulls dominated this step) with a short retry for transient
          # registry hiccups, then import them all into k3d in a single call.
          printf '%s\n' $images | xargs -P 8 -n1 sh -c '
            for attempt in 1 2 3; do
              docker pull "$1" && exit 0
              echo "retry $attempt: docker pull $1" >&2
              sleep 3
            done
            exit 1' _
          k3d image import $images -c burrow-ci
      # The Postgres add-on IS a CloudNativePG `Cluster` (ADR-0066 §1), so the operator is a
      # prerequisite of the suite rather than a variant of it: without it the Postgres e2e skips and
      # the thing this job exists to exercise is not exercised. The release applied here is the pin
      # `burrow cluster postgres install` applies (controlplane/kube CNPGVersion); server-side apply
      # because the CRDs are far past the client-side annotation limit.
      - name: install the CloudNativePG operator
        run: |
          KCFG=$(k3d kubeconfig write burrow-ci)
          version=$(sed -n 's/^const CNPGVersion = "\(.*\)"$/\1/p' controlplane/kube/placement_cnpg.go)
          test -n "$version" || { echo "could not read CNPGVersion from the source" >&2; exit 1; }
          kubectl --kubeconfig "$KCFG" apply --server-side \
            -f "https://github.com/cloudnative-pg/cloudnative-pg/releases/download/v${version}/cnpg-${version}.yaml"
          kubectl --kubeconfig "$KCFG" -n cnpg-system rollout status deploy/cnpg-controller-manager --timeout=180s
      - name: run the kube, engine e2e, and connect proxy tests against k3d
        run: |
          KCFG=$(k3d kubeconfig write burrow-ci)
          export BURROW_TEST_KUBECONFIG="$KCFG"
          # `k3d cluster create --wait` reports the server up, but the k3d load-balancer
          # port the written kubeconfig points at can still EOF the first real request before
          # it is actually forwarding — and /readyz can pass while a namespaced call still
          # drops (observed as the intermittent "create namespace: ... EOF" in the first test).
          # So block until a REAL API call (listing namespaces, the path the tests use)
          # succeeds, not just /readyz, with a generous budget for a cold runner.
          ready=
          for i in $(seq 1 45); do
            if kubectl --kubeconfig "$KCFG" get namespaces >/dev/null 2>&1; then
              echo "k3d API server is serving real requests"
              ready=1
              break
            fi
            echo "waiting for the k3d API server to serve ($i)..."
            sleep 2
          done
          if [ -z "$ready" ]; then
            echo "k3d API server never served a real request within the budget" >&2
            exit 1
          fi
          go test ./controlplane/kube/ -run TestIntegration -v -timeout 280s
          # The Postgres e2e stands up TWO instances — one per environment (ADR-0067 §1) — and
          # round-trips a row through each to prove two environments' apps of the same name do not
          # share a database. Each is a CloudNativePG `Cluster`, so the operator has a bootstrap job
          # and a StatefulSet to reconcile before the server accepts a connection; that plus two
          # attaches and several psql Jobs is why the package's budget is wide. It is a ceiling, not
          # a target.
          go test ./controlplane/e2e/ -v -timeout 900s
          go test ./connect/ -run TestProxyForwardsCustomHeader -v -timeout 300s
          # The control plane's own database is a CloudNativePG `Cluster` (ADR-0086 §1). This applies
          # the real install manifests and then opens the database with the connection string the
          # install wrote, which is the one claim a rendered manifest cannot make: the CRD prunes
          # fields it does not describe, silently and with a 201.
          go test ./cmd/burrow/ -run TestControlPlaneDatabaseIntegration -v -timeout 600s
      - name: capstone e2e (install + deploy through the CLI)
        run: bash test/e2e/install-and-deploy.sh
        env:
          K3D_CLUSTER: burrow-ci
      # Pins the fast path of docs/QUICKSTART.md so the doc cannot rot: build + import the
      # examples/hello image, deploy it, confirm it runs, and assert `app delete` is HELD for
      # confirmation. Reuses the burrow-ci cluster above (K3D_CLUSTER), so it adds no second
      # cluster bring-up and leaves teardown to the delete step below.
      - name: quickstart e2e (the doc's fast path, ending in the delete guardrail)
        run: bash test/e2e/quickstart.sh
        env:
          K3D_CLUSTER: burrow-ci
      - name: delete cluster
        if: always()
        run: k3d cluster delete burrow-ci

  # pr-checks is the single aggregate gate and the ONLY required status check in branch protection.
  # It passes when every other job passed or was legitimately skipped — which, since ADR-0075, means
  # a docs-only change and nothing else: there is no longer a merge_group-only job for it to excuse,
  # so a green PR that touched code is one where the k3d suite actually ran. It fails if any job
  # failed or was cancelled. Requiring just this one check keeps the per-job checks from showing as
  # "skipped/expected" on a PR while still gating the merge on their real results. Add new jobs to
  # its `needs` to include them.
  pr-checks:
    name: PR checks
    needs: [changes, build, license, kube-integration]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: require every job to have passed or been skipped
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "upstream job results: $results"
          for r in $results; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::a required job result was '$r' — failing the PR checks gate"
              exit 1
            fi
          done
          echo "all upstream jobs passed or were legitimately skipped"
